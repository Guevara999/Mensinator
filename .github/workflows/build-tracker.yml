name: Build Custom Cycle Tracker

on:
  workflow_dispatch: # Gives you the manual play button to build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Inject Custom Branding Configuration
      run: |
        # Change "Aura Flow" below to "Calculator" if you want to turn on Stealth Mode!
        find . -type f -name "strings.xml" -exec sed -i 's/>Mensinator</>Aura Flow</g' {} +
        find . -type f -name "strings.xml" -exec sed -i 's/mensinator/Aura Flow/g' {} +
        
        # Premiumize the default cycle notification message text safely
        find . -type f -name "strings.xml" -exec sed -i 's/Your period is about to start/Your cycle window is approaching. Let'\''s check in on your symptoms today ✨/g' {} +

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Android APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Flo-Style-Tracker-Installer
        path: "**/build/outputs/apk/debug/*.apk"
